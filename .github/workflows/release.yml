# Builds the Mac app and publishes it as a GitHub Release (free for public repos).
#
# To release: bump CFBundleShortVersionString in mac/Info.plist and push to main.
# If there's no release for that version yet, this builds one and tags it v<version>.
# (Pushing a v* tag yourself also works.)
name: Release Mac app

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" mac/Info.plist)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists; this run only checks that the app builds."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build HomeDrive.app (Apple silicon + Intel)
        run: OUT=dist UNIVERSAL=1 ./mac/build-app.sh

      - name: Zip it
        run: |
          cd mac/dist
          ditto -c -k --keepParent HomeDrive.app HomeDrive.zip
          ls -lh HomeDrive.zip

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HomeDrive ${{ steps.version.outputs.tag }}
          files: mac/dist/HomeDrive.zip
          generate_release_notes: true

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: HomeDrive
          path: mac/dist/HomeDrive.zip
