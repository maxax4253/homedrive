services:
  # The real HomeDrive: only reachable over Tailscale.
  homedrive:
    image: homedrive-server:local
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    env_file: .env
    environment:
      HOMEDRIVE_BACKUP_DIR: ${BACKUP_DIR:+/backup}
      HOMEDRIVE_PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - ${FILES_DIR:-~/drive}:/files
      - ./data:/data
      - ${BACKUP_DIR:-./data/no-backup}:/backup
    ports:
      # Docker skips ufw, so bind to the Tailscale IP only (never plain "8090:8000").
      - "${BIND_IP:?run setup.sh first}:8090:8000"
    restart: unless-stopped

  # Share-link pages only (turned on with `homedrive links on`). Files are
  # mounted read-only, and it listens on localhost for Tailscale Funnel.
  links:
    image: homedrive-server:local
    profiles: ["links"]
    command: ["uvicorn", "app.public:create_public_app", "--factory", "--host", "0.0.0.0",
              "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: .env
    environment:
      HOMEDRIVE_PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - ${FILES_DIR:-~/drive}:/files:ro
      - ./data:/data
    ports:
      - "127.0.0.1:8091:8000"
    depends_on: [homedrive]
    restart: unless-stopped
