# Runs the server tests, builds and tests the Mac app, and lints the shell scripts
# on every push, so a broken change is caught before it becomes a release.
name: Tests

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r server/requirements.txt pytest httpx
      - name: Test
        run: cd server && python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install bandit pip-audit
      - name: Known security holes in the libraries HomeDrive uses
        run: pip-audit -r server/requirements.txt
      - name: Risky code patterns (medium and high severity)
        run: bandit -q -r server/app server/selftest.py -ll
      - name: Random-junk test with fresh seeds
        run: |
          pip install -r server/requirements.txt pytest httpx
          cd server
          for seed in 11 22 33; do FUZZ_SEED=$seed python -m pytest -q tests/test_fuzz.py; done

  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r server/requirements.txt
      - name: 50,000 files, a 1 GB upload, odd names, 20 users at once
        run: cd server && python tools/stress.py --files 50000 --big-gb 1

  core:
    # The new all-in-one server (Go). Checked by its own tests plus the same test
    # suite, self-test and stress test as the current server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Vet and unit tests
        run: cd core && go mod verify && go vet ./... && go test -race ./...
      - name: Also builds without Tailscale (standard library only)
        run: |
          cd core
          go vet -modfile=go.notailscale.mod -tags notailscale ./...
          go test -modfile=go.notailscale.mod -tags notailscale ./...
      - name: Build (with the race detector for the checks below)
        run: cd core && go build -race -o /tmp/homedrive-core .
      - name: Builds for every system
        run: |
          cd core
          for t in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null . && echo "built $t"
          done
      - name: Same test suite as the current server
        run: |
          pip install -r server/requirements.txt pytest httpx
          cd server && HD_GO_BINARY=/tmp/homedrive-core python -m pytest -q
      - name: Self-test
        run: |
          cd server
          HOMEDRIVE_FILES=/tmp/hd/files HOMEDRIVE_DATA=/tmp/hd/data HOMEDRIVE_USERNAME=max \
            HOMEDRIVE_PASSWORD=ci-password-123 HOMEDRIVE_PUBLIC_URL=http://127.0.0.1:18090 \
            /tmp/homedrive-core -listen 127.0.0.1:18090 2> /tmp/core.log &
          sleep 2
          HD_PAIR_CODE=$(/tmp/homedrive-core pair-code -data /tmp/hd/data -user max) \
          HD_URL=http://127.0.0.1:18090 HD_USER=max HD_PASSWORD=ci-password-123 \
            HD_PUBLIC=http://127.0.0.1:18090 HD_DOCKER=false python selftest.py
          ! grep -q "DATA RACE" /tmp/core.log
      - name: Stress test
        run: |
          cd server && python tools/stress.py --files 50000 --big-gb 1 --go /tmp/homedrive-core 2>&1 | tee /tmp/stress.log
          ! grep -q "DATA RACE" /tmp/stress.log

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cd mac && swift build
      - name: Test
        run: cd mac && swift test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck -S warning install.sh install-mac.sh homedrive server/setup.sh mac/build-app.sh
