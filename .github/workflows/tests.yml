# Runs the server tests, builds and tests the Mac app, and lints the shell scripts
# on every push, so a broken change is caught before it becomes a release.
name: Tests

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r server/requirements.txt pytest httpx
      - name: Test
        run: cd server && python -m pytest -q

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cd mac && swift build
      - name: Test
        run: cd mac && swift test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning install.sh install-mac.sh homedrive server/setup.sh mac/build-app.sh
